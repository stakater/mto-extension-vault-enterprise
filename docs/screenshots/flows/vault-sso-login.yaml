# alice signs in to tenant acme as users do: "Sign in with OIDC Provider", then
# Keycloak (behind Dex) in the popup window the Vault UI opens. Needs
# browser-runner's popup support (click with opensPopup, steps with page:).
name: vault-sso-login

requires:
  env: [VAULT_URL, TENANT, SSO_MOUNT, ALICE_USER, ALICE_PASSWORD]

viewport: { width: 1440, height: 900, deviceScaleFactor: 2, colorScheme: light }

steps:
  # with=oidc and role= fill the form; the mount path does not come from the
  # URL, so it is typed under "Advanced settings".
  - { step: open, url: "${VAULT_URL}/ui/vault/auth?namespace=${TENANT}&with=oidc&role=sso.${TENANT}.editor" }
  - { step: click, selector: 'button:has-text("Advanced settings")' }
  - { step: fill, selector: 'input[name="path"]', value: "${SSO_MOUNT}" }
  - { step: screenshot, path: vault-sso-login.png, fullPage: false }

  # The UI opens Dex in a popup, and Dex hands over to Keycloak. The popup only
  # opens when Vault returns a login URL for this mount and role, so a wrong
  # mount, role or redirect URI fails here.
  - { step: click, selector: 'button[type="submit"]', opensPopup: sso, timeout: 30s }
  - { step: wait-for, page: sso, selector: "#username", timeout: 30s }
  - { step: screenshot, page: sso, path: keycloak-login.png, fullPage: false }
  - { step: fill, page: sso, selector: "#username", value: "${ALICE_USER}" }
  - { step: fill, page: sso, selector: "#password", value: "${ALICE_PASSWORD}" }
  - { step: click, page: sso, selector: "#kc-login" }

  # Main window: the popup posted the code back and closed itself.
  - { step: wait-for-url, url: "/ui/vault/dashboard", timeout: 30s }

  # Who is signed in: the user menu names the login, <namespace>-auth-<mount>-
  # <user>. The check is alice's name through the SSO mount.
  - { step: click, selector: 'button[aria-label="User menu"]' }
  - { step: wait-for, selector: 'text=/oidc-sso-${ALICE_USER}@/i' }
  - { step: screenshot, path: vault-sso-signed-in.png, fullPage: false }

after:
  - { step: screenshot, when: on-failure }
  - { step: screenshot, page: sso, when: on-failure }
