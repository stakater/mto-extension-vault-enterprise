{{/*
Section 4 (own-tenant) — per annotated ServiceAccount:
  - Policy kv.<tenant>.<saNs>.<sa>                 KV grants in the tenant's Vault namespace
  - KubernetesAuthEngineRole same name             bound to the SA in its Kubernetes namespace
  - ConfigMap vault-config-<sa>                    VAULT_* env for SDK consumers
  - SecretStore <sa>-vault                         for ESO consumers (eso=enabled)

A ServiceAccount carrying no `vault.stakater.com/` annotation renders nothing.
One carrying an annotation the chart cannot honour renders a single ConfigMap
`vault-config-<sa>.error` describing the problem, and nothing else — see
`vault.saFacts`. Every SA in .Values.serviceAccounts is in a Kubernetes
namespace owned by .Values.tenant: the child TI's objectFieldRef LIST is scoped
by namespaceSelector matchLabels { <tenantLabelKey>: <tenant> }.

  vault.stakater.com/kv                "true" → the app's own KV prefix
  vault.stakater.com/tier              required with kv: viewer | editor | admin | audit-read
  vault.stakater.com/app               optional: the app that owns the KV prefix (default: SA name)
  vault.stakater.com/kv-subscribe-ns   intra-tenant: CSV of writer namespaces
  vault.stakater.com/kv-export-tenant  cross-tenant share-out: CSV of peer tenants
  vault.stakater.com/kv-import-tenant  cross-tenant share-in: CSV of peer tenants
*/}}
{{- /* Two components share this file's per-SA loop and validations: core
       emits Policy/Role/ConfigMap, eso emits the SecretStore. */ -}}
{{- $renderCore := include "vault.componentEnabled" (dict "component" "core" "ctx" .) }}
{{- $renderEso := include "vault.componentEnabled" (dict "component" "eso" "ctx" .) }}
{{- if or $renderCore $renderEso }}
{{- $tenant := required ".Values.tenant must be set by the parent" .Values.tenant }}
{{- $env := .Values.env }}
{{- $labels := include "vault.labels" . }}
{{- $tenantNs := include "vault.nsPath" (dict "ctx" $ "name" $tenant) }}
{{- $sharedNs := include "vault.nsPath" (dict "ctx" $ "name" .Values.sharedTenant.name) }}
{{- $k8sMount := include "vault.k8sAuthMount" . }}
{{- $tenantNamespaces := include "vault.tenantNamespaces" . | fromYaml }}
{{- $appClaims := include "vault.appClaims" . | fromYaml }}
{{- /* Own-app leaves requested via kv-secret.<name>, keyed <ns>/<sa>. The
       #<key> fragment names a key inside the leaf, not a path. Informational
       only — the authoritative grant set is saFacts. */ -}}
{{- $secretLeaves := dict }}
{{- range $d := (ternary .Values.deployments (list) (kindIs "slice" .Values.deployments)) }}
{{- $dNs := dig "metadata" "namespace" "" $d }}
{{- $dSa := dig "spec" "template" "spec" "serviceAccountName" "" $d }}
{{- if and $dNs $dSa }}
{{- range $key, $rawVal := (dig "metadata" "annotations" (dict) $d) }}
{{- if hasPrefix "vault.stakater.com/kv-secret." $key }}
{{- $k := printf "%s/%s" $dNs $dSa }}
{{- $leaf := first (splitList "#" (toString $rawVal)) }}
{{- /* Same shape rule 05 enforces: a hostile value must not forge sibling
       fields in the entry block or name a path outside the app prefix. */ -}}
{{- if and $leaf (regexMatch "^[A-Za-z0-9_-]([A-Za-z0-9._/-]*[A-Za-z0-9_-])?$" $leaf) (not (contains ".." $leaf)) (not (contains "//" $leaf)) }}
{{- $_ := set $secretLeaves $k (append (index $secretLeaves $k | default (list)) $leaf) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- /* Index accumulators: healthy entries keyed by resolved app, error entries
       by ServiceAccount name (the resolved app may be the invalid part). */ -}}
{{- $idxHealthy := dict }}
{{- $idxErrs := dict }}
{{- $caBundleDone := dict }}
{{- range $sa := (ternary .Values.serviceAccounts (list) (kindIs "slice" .Values.serviceAccounts)) }}
{{- $f := include "vault.saFacts" (dict "sa" $sa "ctx" $ "tenantNamespaces" $tenantNamespaces "appClaims" $appClaims) | fromYaml }}
{{- $saName := $f.name }}
{{- $saNs := $f.ns }}
{{- $app := $f.app }}
{{- $tier := $f.tier }}
{{- $caps := $f.caps }}
{{- $subscribeRaw := dig "metadata" "annotations" "vault.stakater.com/kv-subscribe-ns" "" $sa }}
{{- $exposeRaw := dig "metadata" "annotations" "vault.stakater.com/kv-export-tenant" "" $sa }}
{{- $importRaw := dig "metadata" "annotations" "vault.stakater.com/kv-import-tenant" "" $sa }}
{{- if and $f.errors $saName $saNs }}
{{- $m := index $idxErrs $saNs | default (dict) }}
{{- $_ := set $m $saName (printf "error: Vault annotations rejected — see ConfigMap vault-config-%s.error in this namespace" $saName) }}
{{- $_ := set $idxErrs $saNs $m }}
{{- if $renderCore }}
---
{{ include "vault.errorConfigMap" (dict "name" (printf "vault-config-%s.error" $saName) "ns" $saNs "labels" $labels "subject" (printf "ServiceAccount %s/%s" $saNs $saName) "errors" $f.errors) }}
{{- end }}
{{- else if and $saName $saNs $f.kvOn }}
{{- $roleName := include "vault.roleName" (dict "tenant" $tenant "saNs" $saNs "saName" $saName) }}
{{- $entry := printf "serviceAccount: %q\ntier: %q\nkvPath: kv/data/%s/%s/%s/" $saName $tier $env $saNs $app }}
{{- $leaves := index $secretLeaves (printf "%s/%s" $saNs $saName) }}
{{- if $leaves }}
{{- $entry = printf "%s\nrequestedSecrets: %q" $entry (join ", " (uniq (sortAlpha $leaves))) }}
{{- end }}
{{- $m := index $idxHealthy $saNs | default (dict) }}
{{- $_ := set $m $app $entry }}
{{- $_ := set $idxHealthy $saNs $m }}
{{- if $renderCore }}
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: Policy
metadata:
  name: {{ $roleName }}
  namespace: {{ $.Values.configNamespace }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  {{- include "vault.vcoAuth" (dict "ctx" $ "target" $tenant) | nindent 2 }}
  name: {{ $roleName }}
  policy: |
    # 1. The app's own secrets, at kv/data/<env>/<ns>/<app>/. The app defaults to
    # the ServiceAccount name — the identity Vault authenticated — and is unique
    # within the namespace either by Kubernetes' own guarantee or by the render
    # check behind `vault.stakater.com/app`. Scoping here rather than at the
    # namespace stops one workload reading another's secrets just by sharing a
    # namespace with it.
    path "kv/data/{{ $env }}/{{ $saNs }}/{{ $app }}/*"     { capabilities = {{ $caps }} }
    path "kv/metadata/{{ $env }}/{{ $saNs }}/{{ $app }}/*" { capabilities = {{ $caps }} }
    {{- if eq $tier "admin" }}
    path "kv/delete/{{ $env }}/{{ $saNs }}/{{ $app }}/*"   { capabilities = ["update"] }
    path "kv/undelete/{{ $env }}/{{ $saNs }}/{{ $app }}/*" { capabilities = ["update"] }
    path "kv/destroy/{{ $env }}/{{ $saNs }}/{{ $app }}/*"  { capabilities = ["update"] }
    {{- end }}
    # 2a. _shared/ READ — own Kubernetes namespace sub-prefix (all data-reading
    # tiers). This is how two apps in one namespace share deliberately.
    {{- if ne $tier "audit-read" }}
    path "kv/data/{{ $env }}/_shared/from-{{ $saNs }}/*"     { capabilities = ["read", "list"] }
    {{- end }}
    path "kv/metadata/{{ $env }}/_shared/from-{{ $saNs }}/*" { capabilities = {{ $caps }} }
    {{- /* Subscriptions are READ-ONLY on the producing namespace's prefix, on
           BOTH the data and the metadata path. In KV v2 the metadata endpoint is
           where the secret's lifecycle lives: `update` sets max_versions /
           delete_version_after / cas_required and `delete` removes every
           version, so a subscriber with its own tier caps here could destroy
           secrets it only reads. */ -}}
    {{- if $subscribeRaw }}
    {{- $subCaps := ternary "[\"list\"]" "[\"read\", \"list\"]" (eq $tier "audit-read") }}
    {{- range $subNs := splitList "," $subscribeRaw }}
    {{- $subNs = trim $subNs }}
    {{- if $subNs }}
    {{- if ne $tier "audit-read" }}
    path "kv/data/{{ $env }}/_shared/from-{{ $subNs }}/*"     { capabilities = ["read", "list"] }
    {{- end }}
    path "kv/metadata/{{ $env }}/_shared/from-{{ $subNs }}/*" { capabilities = {{ $subCaps }} }
    {{- end }}
    {{- end }}
    {{- end }}
    # 2b. _shared/ WRITE scoped to own Kubernetes namespace sub-prefix.
    {{- if or (eq $tier "editor") (eq $tier "admin") }}
    path "kv/data/{{ $env }}/_shared/from-{{ $saNs }}/*"     { capabilities = {{ $caps }} }
    path "kv/metadata/{{ $env }}/_shared/from-{{ $saNs }}/*" { capabilities = {{ $caps }} }
    {{- end }}
    {{- if eq $tier "admin" }}
    path "kv/delete/{{ $env }}/_shared/from-{{ $saNs }}/*"   { capabilities = ["update"] }
    path "kv/undelete/{{ $env }}/_shared/from-{{ $saNs }}/*" { capabilities = ["update"] }
    path "kv/destroy/{{ $env }}/_shared/from-{{ $saNs }}/*"  { capabilities = ["update"] }
    {{- end }}
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: KubernetesAuthEngineRole
metadata:
  name: {{ $roleName }}
  namespace: {{ $.Values.configNamespace }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  {{- include "vault.vcoAuth" (dict "ctx" $ "target" $tenant) | nindent 2 }}
  name: {{ $roleName }}
  path: {{ $k8sMount }}
  targetServiceAccounts:
    - {{ $saName }}
  targetNamespaces:
    targetNamespaces:
      - {{ $saNs }}
  policies:
    - {{ $roleName }}
  {{- include "vault.roleTokenFields" $ | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config-{{ $saName }}
  namespace: {{ $saNs }}
  labels:
    {{- $labels | nindent 4 }}
    vault.stakater.com/app: {{ $app | quote }}
data:
  VAULT_ADDR: {{ $.Values.vaultServer }}
  {{- if $.Values.vaultCABundle }}
  VAULT_CACERT: /etc/vault/ca/ca.crt
  {{- end }}
  VAULT_NAMESPACE: {{ $tenantNs | quote }}
  VAULT_K8S_MOUNT: {{ $k8sMount }}
  VAULT_K8S_ROLE: {{ $roleName }}
  VAULT_KV_APP: {{ $app | quote }}
  VAULT_KV_APP_PATH: kv/data/{{ $env }}/{{ $saNs }}/{{ $app }}/
  VAULT_KV_APP_META_PATH: kv/metadata/{{ $env }}/{{ $saNs }}/{{ $app }}/
  VAULT_KV_SHARED_OUT_PATH: kv/data/{{ $env }}/_shared/from-{{ $saNs }}/
  {{- if $subscribeRaw }}
  {{- range $subNs := splitList "," $subscribeRaw }}
  {{- $subNs = trim $subNs }}
  {{- if $subNs }}
  {{- $subKey := upper (replace "-" "_" $subNs) }}
  VAULT_FROM_{{ $subKey }}_PATH: kv/data/{{ $env }}/_shared/from-{{ $subNs }}/
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if $exposeRaw }}
  {{- range $peer := splitList "," $exposeRaw }}
  {{- $peer = trim $peer }}
  {{- if include "vault.peerEmittable" (dict "peer" $peer "knownCsv" $.Values.knownTenants) }}
  {{- $peerKey := upper (replace "-" "_" $peer) }}
  VAULT_OUT_{{ $peerKey }}_NAMESPACE: {{ $sharedNs | quote }}
  VAULT_OUT_{{ $peerKey }}_ROLE: {{ include "vault.shareOutName" (dict "tenant" $tenant "saNs" $saNs "saName" $saName "peer" $peer) }}
  VAULT_OUT_{{ $peerKey }}_PATH: kv/data/{{ $env }}/from-{{ $tenant }}/to-{{ $peer }}/
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if $importRaw }}
  {{- range $peer := splitList "," $importRaw }}
  {{- $peer = trim $peer }}
  {{- if include "vault.peerEmittable" (dict "peer" $peer "knownCsv" $.Values.knownTenants) }}
  {{- $peerKey := upper (replace "-" "_" $peer) }}
  VAULT_IN_{{ $peerKey }}_NAMESPACE: {{ $sharedNs | quote }}
  VAULT_IN_{{ $peerKey }}_ROLE: {{ include "vault.shareInName" (dict "tenant" $tenant "saNs" $saNs "saName" $saName "peer" $peer) }}
  VAULT_IN_{{ $peerKey }}_PATH: kv/data/{{ $env }}/from-{{ $peer }}/to-{{ $tenant }}/
  {{- end }}
  {{- end }}
  {{- end }}
{{- if and $.Values.vaultCABundle (not (hasKey $caBundleDone $saNs)) }}
{{- $_ := set $caBundleDone $saNs true }}
---
{{- /* A CA bundle is a public certificate, so it ships as a ConfigMap, which
       keeps Secret write access out of the bootstrap ClusterRole. One per
       namespace. */ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-ca-bundle
  namespace: {{ $saNs }}
  labels:
    {{- $labels | nindent 4 }}
data:
  ca.crt: |
{{ $.Values.vaultCABundle | indent 4 }}
{{- end }}
{{- end }}
{{- if and $renderEso (eq $.Values.eso "enabled") }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $saName }}-vault
  namespace: {{ $saNs }}
  labels:
    {{- $labels | nindent 4 }}
    vault.stakater.com/app: {{ $app | quote }}
spec:
  provider:
    vault:
      server: {{ $.Values.vaultServer }}
      {{- if $.Values.vaultCABundle }}
      caBundle: {{ $.Values.vaultCABundle | b64enc | quote }}
      {{- end }}
      path: kv
      version: v2
      namespace: {{ $tenantNs | quote }}
      auth:
        kubernetes:
          mountPath: {{ $k8sMount }}
          role: {{ $roleName }}
          serviceAccountRef:
            name: {{ $saName }}
{{- end }}
{{- end }}
{{- end }}
{{- /* One per workload namespace with an annotated ServiceAccount: the
       app -> path directory a seeder reads instead of hopping Deployment ->
       serviceAccountName -> vault-config-<sa>. A signpost, never an input —
       editing it changes no access. */ -}}
{{- if $renderCore }}
{{- $idxNs := dict }}
{{- range $ns, $_x := $idxHealthy }}{{- $_ := set $idxNs $ns true }}{{- end }}
{{- range $ns, $_x := $idxErrs }}{{- $_ := set $idxNs $ns true }}{{- end }}
{{- range $ns, $_x := $idxNs }}
{{- $healthy := index $idxHealthy $ns | default (dict) }}
{{- $errsIdx := index $idxErrs $ns | default (dict) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-apps
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
data:
  _format: "v1"
  _usage: "One entry per app that uses Vault in this namespace. Paths are API data paths; in the Vault UI switch to namespace {{ $tenantNs }}, open the kv mount and browse <env>/<namespace>/<app>/. The vault-config-<serviceaccount> ConfigMap holds the full environment for one app."
  {{- if $healthy }}
  _namespace: |
    sharedOutPath: kv/data/{{ $env }}/_shared/from-{{ $ns }}/
  {{- end }}
  {{- range $appName, $entry := $healthy }}
  {{ $appName | quote }}: |
    {{- $entry | nindent 4 }}
  {{- end }}
  {{- /* Always .error-suffixed: app names cannot contain dots, so these keys
         never collide with a healthy entry. */ -}}
  {{- range $errSa, $entry := $errsIdx }}
  {{ printf "%s.error" $errSa | quote }}: |
    {{- $entry | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
