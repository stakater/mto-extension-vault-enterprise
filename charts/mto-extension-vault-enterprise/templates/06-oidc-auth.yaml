{{- if include "vault.componentEnabled" (dict "component" "core" "ctx" .) }}
{{/*
Section 6 — per-tenant OIDC scaffolding for human SSO, gated by sso.enabled.

  - AuthEngineMount oidc/sso in the tenant's Vault namespace.
  - JWTOIDCAuthEngineConfig pointing at the IdP. With
    sso.oidc.perTenantClient=false (default) every tenant shares one IdP client
    (sso.oidc.clientId + clientSecretRef); tenants are told apart by the groups
    claim → role mapping in §7. With perTenantClient=true the chart expects a
    Secret "<tenant>-<clientSecretRef.name>" and client id "<tenant>-<clientId>".

VCO reads the client secret from clientSecretRef in configNamespace.
*/}}
{{- if .Values.sso.enabled }}
{{- if not .Values.sso.oidc.issuerUrl }}
{{- fail "sso.enabled=true requires sso.oidc.issuerUrl to be set" }}
{{- end }}
{{- $name := required ".Values.tenant must be set by the parent" .Values.tenant }}
{{- $labels := include "vault.labels" . }}
{{- $clientId := .Values.sso.oidc.clientId }}
{{- $secretName := .Values.sso.oidc.clientSecretRef.name }}
{{- if .Values.sso.oidc.perTenantClient }}
{{- $clientId = printf "%s-%s" $name $clientId }}
{{- $secretName = printf "%s-%s" $name $secretName }}
{{- end }}
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: AuthEngineMount
metadata:
  name: {{ $name }}-oidc
  namespace: {{ .Values.configNamespace }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  {{- include "vault.vcoAuth" (dict "ctx" $ "target" $name) | nindent 2 }}
  path: {{ .Values.sso.mount.path }}
  name: {{ .Values.sso.mount.name }}
  type: oidc
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: JWTOIDCAuthEngineConfig
metadata:
  name: {{ $name }}-oidc-config
  namespace: {{ .Values.configNamespace }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  {{- include "vault.vcoAuth" (dict "ctx" $ "target" $name) | nindent 2 }}
  path: {{ include "vault.ssoMount" . }}
  OIDCDiscoveryURL: {{ .Values.sso.oidc.issuerUrl | quote }}
  {{- if .Values.sso.oidc.caBundlePem }}
  OIDCDiscoveryCAPEM: |
{{ .Values.sso.oidc.caBundlePem | indent 4 }}
  {{- end }}
  OIDCClientID: {{ $clientId | quote }}
  OIDCCredentials:
    secret:
      name: {{ $secretName }}
    passwordKey: {{ .Values.sso.oidc.clientSecretRef.key }}
{{- end }}
{{- end }}
