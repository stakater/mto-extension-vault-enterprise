{{/*
Section 5 — per annotated Deployment, render one ExternalSecret per
`vault.stakater.com/{kv-secret,kv-subscribe,kv-import}.<name>` annotation.

Annotation forms:
  kv-secret.<name>:    <leaf>[#<key>]                 own-app      → kv/data/<env>/<dNs>/<app>/<leaf>                      store: <sa>-vault
  kv-subscribe.<name>: <writer-saNs>/<leaf>[#<key>]   intra-tenant → kv/data/<env>/_shared/from-<writer>/<leaf>            store: <sa>-vault
  kv-import.<name>:    <peer-tenant>/<leaf>[#<key>]   cross-tenant → kv/data/<env>/from-<peer>/to-<own-tenant>/<leaf>      store: <sa>.share-<peer>-vault

The `kv-` prefix matches the ServiceAccount-side grant each form consumes:
kv-subscribe.<name> reads what kv-subscribe-ns granted, kv-import.<name> reads
what kv-import-tenant granted, kv-secret.<name> reads the app's own kv prefix.

The ExternalSecret and its target Secret are named `<sa>-<name>`, after the
Deployment's ServiceAccount. Kubernetes object names follow the ServiceAccount
while Vault paths follow the app: replacing a ServiceAccount already forces an edit
to this Deployment (serviceAccountName has to change), so there is nothing to
gain from naming objects after the app, and an app rename would otherwise break
`envFrom` on a Deployment whose ServiceAccount never changed.

`<app>` is resolved from the Deployment's ServiceAccount, not from the
Deployment — Vault authenticates the ServiceAccount token, so two Deployments
sharing one ServiceAccount are indistinguishable to Vault and cannot be given
different app identities.

A problem attributable to one Deployment renders `vault-config-<name>.deploy-error`
in its namespace and no ExternalSecret for it.

Skipped entirely when eso=disabled.
*/}}
{{- /* ESO off install-wide, but Deployments still asking for secrets: the
       annotation looks effective and is not. Rendered from CORE, because with eso
       disabled the eso slice has no TemplateInstance to report from. The two
       gates are mutually exclusive, so a Deployment never gets both. */ -}}
{{- if and (ne .Values.eso "enabled") (include "vault.componentEnabled" (dict "component" "core" "ctx" .)) }}
{{- $labels := include "vault.labels" . }}
{{- $p := "vault.stakater.com/" }}
{{- range $d := (ternary .Values.deployments (list) (kindIs "slice" .Values.deployments)) }}
{{- $dNs := dig "metadata" "namespace" "" $d }}
{{- $dName := dig "metadata" "name" "" $d }}
{{- $asked := list }}
{{- range $key, $_ := (dig "metadata" "annotations" (dict) $d) }}
{{- if or (hasPrefix (printf "%skv-secret." $p) $key) (hasPrefix (printf "%skv-subscribe." $p) $key) (hasPrefix (printf "%skv-import." $p) $key) }}
{{- $asked = append $asked $key }}
{{- end }}
{{- end }}
{{- if and $dNs $dName $asked }}
{{- $errs := list }}
{{- if $asked }}
{{- $errs = append $errs (printf "%s requested but External Secrets Operator is disabled for this whole install (eso=disabled), so no ExternalSecret is rendered and no Secret will appear. Either ask the platform to enable ESO, or read the secret from Vault directly using the vault-config-<serviceaccount> ConfigMap" (join ", " (sortAlpha $asked))) }}
{{- end }}
---
{{ include "vault.errorConfigMap" (dict "name" (printf "vault-config-%s.deploy-error" $dName) "ns" $dNs "labels" $labels "subject" (printf "Deployment %s/%s" $dNs $dName) "errors" $errs) }}
{{- end }}
{{- end }}
{{- end }}

{{- if and (eq .Values.eso "enabled") (include "vault.componentEnabled" (dict "component" "eso" "ctx" .)) }}
{{- $dTenant := required ".Values.tenant must be set by the parent" .Values.tenant }}
{{- $env := .Values.env }}
{{- $refresh := .Values.externalSecretRefreshInterval }}
{{- $labels := include "vault.labels" . }}
{{- $p := "vault.stakater.com/" }}
{{- /* Set of every k8s namespace this tenant owns, from the SA + Deployment
       lists. Used to reject subscribe.<name> writer namespaces outside the
       tenant (same rule as kv-subscribe-ns in 04-sa-own-tenant.yaml). */ -}}
{{- $tenantNamespaces := dict }}
{{- range $sa := (ternary .Values.serviceAccounts (list) (kindIs "slice" .Values.serviceAccounts)) }}
{{- $ns := dig "metadata" "namespace" "" $sa }}
{{- if $ns }}{{ $_ := set $tenantNamespaces $ns true }}{{ end }}
{{- end }}
{{- range $dd := (ternary .Values.deployments (list) (kindIs "slice" .Values.deployments)) }}
{{- $ns := dig "metadata" "namespace" "" $dd }}
{{- if $ns }}{{ $_ := set $tenantNamespaces $ns true }}{{ end }}
{{- end }}
{{- /* Pass 1 — index ServiceAccounts by <ns>/<name> so a Deployment can resolve
       its app identity and confirm its grants. Without this join an
       ExternalSecret can name a path the policy never granted: ESO 403s forever
       and the annotation looks fine. */ -}}
{{- $appClaims := include "vault.appClaims" . | fromYaml }}
{{- $saByKey := dict }}
{{- range $sa := (ternary .Values.serviceAccounts (list) (kindIs "slice" .Values.serviceAccounts)) }}
{{- $f := include "vault.saFacts" (dict "sa" $sa "ctx" $ "tenantNamespaces" $tenantNamespaces "appClaims" $appClaims) | fromYaml }}
{{- if and $f.name $f.ns }}
{{- $_ := set $saByKey (printf "%s/%s" $f.ns $f.name) (dict "facts" $f
      "importRaw" (dig "metadata" "annotations" (printf "%skv-import-tenant" $p) "" $sa)
      "subscribeRaw" (dig "metadata" "annotations" (printf "%skv-subscribe-ns" $p) "" $sa)) }}
{{- end }}
{{- end }}
{{- /* Pass 2 — resolve into records, collecting errors and name claims. Nothing
       renders yet: a name claimed twice can only be judged once every claimant is
       known. */ -}}
{{- $dErrs := dict }}
{{- $claims := dict }}
{{- $firstRec := dict }}
{{- range $d := (ternary .Values.deployments (list) (kindIs "slice" .Values.deployments)) }}
{{- $dNs := dig "metadata" "namespace" "" $d }}
{{- $dName := dig "metadata" "name" "" $d }}
{{- $dSa := dig "spec" "template" "spec" "serviceAccountName" "" $d }}
{{- $annotations := dig "metadata" "annotations" (dict) $d }}
{{- $dKey := printf "%s/%s" $dNs $dName }}
{{- if and $dNs $dName }}
{{- range $key, $rawVal := $annotations }}
{{- if hasPrefix $p $key }}
{{- $short := trimPrefix $p $key }}
{{- $isSecret := hasPrefix "kv-secret." $short }}
{{- $isShared := hasPrefix "kv-subscribe." $short }}
{{- $isImport := hasPrefix "kv-import." $short }}
{{- if not (or $isSecret $isShared $isImport) }}
{{- /* Read on a ServiceAccount, or a typo — each gets its own fix. */ -}}
{{- if has $short (include "vault.saAnnotationKeys" $ | fromYamlArray) }}
{{- $_ := set $dErrs $dKey (append (index $dErrs $dKey | default (list)) (printf "%s%s is read on the ServiceAccount, not on a Deployment — move it to ServiceAccount %q. On a Deployment it has no effect" $p $short (default "<none>" $dSa))) }}
{{- else }}
{{- $_ := set $dErrs $dKey (append (index $dErrs $dKey | default (list)) (printf "unknown annotation %q — a Deployment accepts only %skv-secret.<name>, %skv-subscribe.<name> and %skv-import.<name>" $key $p $p $p)) }}
{{- end }}
{{- else if not $dSa }}
{{- $_ := set $dErrs $dKey (append (index $dErrs $dKey | default (list)) (printf "%s requires spec.template.spec.serviceAccountName to be set: Vault authenticates the workload's ServiceAccount, and a pod that omits it runs as `default`, which cannot be granted access" $key)) }}
{{- else }}
{{- $secretName := "" }}
{{- if $isSecret }}{{ $secretName = trimPrefix "kv-secret." $short }}{{ end }}
{{- if $isShared }}{{ $secretName = trimPrefix "kv-subscribe." $short }}{{ end }}
{{- if $isImport }}{{ $secretName = trimPrefix "kv-import." $short }}{{ end }}
{{- $esName := printf "%s-%s" $dSa $secretName }}
{{- $sliceParts := splitList "#" $rawVal }}
{{- $valBody := index $sliceParts 0 }}
{{- $sliceKey := "" }}
{{- if gt (len $sliceParts) 1 }}{{ $sliceKey = index $sliceParts 1 }}{{ end }}
{{- $sa := index $saByKey (printf "%s/%s" $dNs $dSa) }}
{{- $vaultPath := "" }}
{{- $storeName := "" }}
{{- $skip := false }}
{{- /* <name> becomes half of the Secret's object name and the leaf is spliced
       into remoteRef.key; neither is checked anywhere else. An invalid name is
       rejected by the apiserver (failing the whole tenant's apply), and a leaf
       with `..` or a newline names a path outside the app's prefix. */ -}}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $secretName) }}
{{- $_ := set $dErrs $dKey (append (index $dErrs $dKey | default (list)) (printf "%s: the suffix %q names the Kubernetes Secret (%s-%s), so it must match ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ (lowercase letters, digits and hyphens)" $key $secretName $dSa $secretName)) }}
{{- $skip = true }}
{{- else if not (and (regexMatch "^[A-Za-z0-9_-]([A-Za-z0-9._/-]*[A-Za-z0-9_-])?$" $valBody) (not (contains ".." $valBody)) (not (contains "//" $valBody))) }}
{{- $_ := set $dErrs $dKey (append (index $dErrs $dKey | default (list)) (printf "%s value %q is not a valid secret reference: slash-separated segments of letters, digits, dots, underscores and hyphens only — no leading/trailing slash, no `..`, no whitespace" $key $rawVal)) }}
{{- $skip = true }}
{{- else if and $sliceKey (not (regexMatch "^[A-Za-z0-9._-]+$" $sliceKey)) }}
{{- /* Becomes a key of the target Secret, so it must match [-._a-zA-Z0-9]+.
       Quoted in the message: a raw newline would end the ERROR block scalar
       and forge a top-level field on the ConfigMap. */ -}}
{{- $_ := set $dErrs $dKey (append (index $dErrs $dKey | default (list)) (printf "%s: the %q field selector must match ^[A-Za-z0-9._-]+$ (it becomes a key in the Kubernetes Secret)" $key $sliceKey)) }}
{{- $skip = true }}
{{- end }}
{{- if not $sa }}
{{- $_ := set $dErrs $dKey (append (index $dErrs $dKey | default (list)) (printf "%s names ServiceAccount %q, which does not exist in namespace %s — no SecretStore is rendered for it, so the ExternalSecret could never sync" $key $dSa $dNs)) }}
{{- $skip = true }}
{{- else if $sa.facts.errors }}
{{- $_ := set $dErrs $dKey (append (index $dErrs $dKey | default (list)) (printf "%s depends on ServiceAccount %q, whose Vault annotations are rejected — see vault-config-%s.error in this namespace" $key $dSa $dSa)) }}
{{- $skip = true }}
{{- else if not $sa.facts.kvOn }}
{{- $_ := set $dErrs $dKey (append (index $dErrs $dKey | default (list)) (printf "%s needs KV access, but ServiceAccount %q does not set %skv: \"true\" — no SecretStore is rendered for it" $key $dSa $p)) }}
{{- $skip = true }}
{{- end }}
{{- if not $skip }}
{{- if $isSecret }}
{{- $vaultPath = printf "%s/%s/%s/%s" $env $dNs $sa.facts.app $valBody }}
{{- $storeName = printf "%s-vault" $dSa }}
{{- else if $isShared }}
{{- $refParts := splitList "/" $valBody }}
{{- if ge (len $refParts) 2 }}
{{- $writerNs := first $refParts }}
{{- $subs := list }}
{{- range $x := splitList "," $sa.subscribeRaw }}{{ $subs = append $subs (trim $x) }}{{ end }}
{{- if not (hasKey $tenantNamespaces $writerNs) }}
{{- $_ := set $dErrs $dKey (append (index $dErrs $dKey | default (list)) (printf "%s references writer namespace %q, which is not a namespace of tenant %q (tenant owns: %s)" $key $writerNs $dTenant (join ", " (keys $tenantNamespaces | sortAlpha)))) }}
{{- $skip = true }}
{{- else if and (ne $writerNs $dNs) (not (has $writerNs $subs)) }}
{{- /* Reading another namespace's `_shared/` is granted ONLY by kv-subscribe-ns;
       the un-annotated policy grants from-<own-ns>/ alone. Own-namespace
       subscriptions need no annotation, hence the ne comparison. */ -}}
{{- $_ := set $dErrs $dKey (append (index $dErrs $dKey | default (list)) (printf "%s reads namespace %q, but ServiceAccount %q does not list it in %skv-subscribe-ns — the policy read grant it needs is never rendered, so this ExternalSecret would fail to sync indefinitely. Add %skv-subscribe-ns: %s to that ServiceAccount" $key $writerNs $dSa $p $p $writerNs)) }}
{{- $skip = true }}
{{- else }}
{{- $vaultPath = printf "%s/_shared/from-%s/%s" $env $writerNs (join "/" (rest $refParts)) }}
{{- $storeName = printf "%s-vault" $dSa }}
{{- end }}
{{- else }}
{{- $_ := set $dErrs $dKey (append (index $dErrs $dKey | default (list)) (printf "%s value %q must be <writer-namespace>/<leaf>" $key $rawVal)) }}
{{- $skip = true }}
{{- end }}
{{- else if $isImport }}
{{- $refParts := splitList "/" $valBody }}
{{- if ge (len $refParts) 2 }}
{{- $peer := first $refParts }}
{{- $peers := list }}
{{- range $x := splitList "," $sa.importRaw }}{{ $peers = append $peers (trim $x) }}{{ end }}
{{- if not (has $peer $peers) }}
{{- $_ := set $dErrs $dKey (append (index $dErrs $dKey | default (list)) (printf "%s imports from tenant %q, but ServiceAccount %q does not list it in %skv-import-tenant — the share-in SecretStore it needs is never rendered" $key $peer $dSa $p)) }}
{{- $skip = true }}
{{- else if not (include "vault.peerEmittable" (dict "peer" $peer "knownCsv" $.Values.knownTenants)) }}
{{- /* An off-roster peer renders nothing so the share self-heals when that tenant
       appears. A misspelling never appears, and the two are indistinguishable
       from here — so report rather than skip silently. */ -}}
{{- $_ := set $dErrs $dKey (append (index $dErrs $dKey | default (list)) (printf "%s imports from tenant %q, which is not in the tenant roster — nothing is rendered for it. If that tenant does not exist yet this resolves itself once it does; if it should exist already, check the spelling (roster: %s)" $key $peer $.Values.knownTenants)) }}
{{- $skip = true }}
{{- else }}
{{- $vaultPath = printf "%s/from-%s/to-%s/%s" $env $peer $dTenant (join "/" (rest $refParts)) }}
{{- $storeName = printf "%s.share-%s-vault" $dSa $peer }}
{{- end }}
{{- else }}
{{- $_ := set $dErrs $dKey (append (index $dErrs $dKey | default (list)) (printf "%s value %q must be <peer-tenant>/<leaf>" $key $rawVal)) }}
{{- $skip = true }}
{{- end }}
{{- end }}
{{- end }}
{{- if not $skip }}
{{- $cKey := printf "%s/%s" $dNs $esName }}
{{- $fp := printf "%s|%s|%s" $vaultPath $storeName $sliceKey }}
{{- $byFp := index $claims $cKey | default (dict) }}
{{- $_ := set $byFp $fp (append (index $byFp $fp | default (list)) $dName | sortAlpha | uniq) }}
{{- $_ := set $claims $cKey $byFp }}
{{- if not (hasKey $firstRec $cKey) }}
{{- $_ := set $firstRec $cKey (dict "ns" $dNs "esName" $esName "vaultPath" $vaultPath "storeName" $storeName "sliceKey" $sliceKey "app" $sa.facts.app) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- /* Two ExternalSecrets cannot share a name in one namespace. Identical specs
       are deduped rather than rejected: a service and its migration job sharing a
       ServiceAccount and asking for the same secret is normal. */ -}}
{{- range $cKey, $byFp := $claims }}
{{- if gt (len (keys $byFp)) 1 }}
{{- $names := list }}
{{- range $fp, $ds := $byFp }}{{ $names = concat $names $ds }}{{ end }}
{{- range $fp, $ds := $byFp }}
{{- range $dn := $ds }}
{{- $dk := printf "%s/%s" (index (splitList "/" $cKey) 0) $dn }}
{{- $_ := set $dErrs $dk (append (index $dErrs $dk | default (list)) (printf "Deployments %s all render ExternalSecret %q in this namespace but ask for different secrets, and two ExternalSecrets cannot share a name. Rename the annotation suffix on all but one" (join ", " (uniq $names | sortAlpha)) (index (splitList "/" $cKey) 1))) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- /* Render — errors, then ExternalSecrets whose name is unambiguous and whose
       Deployment has no errors. */ -}}
{{- range $dKey, $errs := $dErrs }}
{{- $parts := splitList "/" $dKey }}
---
{{ include "vault.errorConfigMap" (dict "name" (printf "vault-config-%s.deploy-error" (index $parts 1)) "ns" (index $parts 0) "labels" $labels "subject" (printf "Deployment %s" $dKey) "errors" $errs) }}
{{- end }}
{{- range $cKey, $byFp := $claims }}
{{- if eq (len (keys $byFp)) 1 }}
{{- $r := index $firstRec $cKey }}
{{- /* Withheld only when EVERY claimant errs: a service and its migration Job
       share one ServiceAccount, so a typo on the Job must not delete the
       service's Secret. A solo erroring Deployment still gets nothing. */ -}}
{{- $anyClean := false }}
{{- range $fp, $ds := $byFp }}
{{- range $dn := $ds }}
{{- if not (hasKey $dErrs (printf "%s/%s" $r.ns $dn)) }}{{ $anyClean = true }}{{ end }}
{{- end }}
{{- end }}
{{- if $anyClean }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $r.esName }}
  namespace: {{ $r.ns }}
  labels:
    {{- $labels | nindent 4 }}
    vault.stakater.com/app: {{ $r.app | quote }}
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    name: {{ $r.storeName }}
    kind: SecretStore
  target:
    name: {{ $r.esName }}
    creationPolicy: Owner
  {{- if $r.sliceKey }}
  data:
    - secretKey: {{ $r.sliceKey }}
      remoteRef:
        key: {{ $r.vaultPath }}
        property: {{ $r.sliceKey }}
  {{- else }}
  dataFrom:
    - extract:
        key: {{ $r.vaultPath }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
