{{- if include "vault.componentEnabled" (dict "component" "core" "ctx" .) }}
{{/*
Section 8 — per-workload-namespace NetworkPolicy (off by default).

When networkPolicy.enabled=true, the chart emits two NetworkPolicies per
tenant namespace:

  1. default-deny — denies all ingress except from within the same
     namespace and Vault egress (catches accidental cross-tenant traffic).
  2. vault-egress  — allows egress to the Vault pod (matched via
     networkPolicy.vaultSelector) and to the cluster apiserver
     (necessary for the SA token round-trip during k8s auth).

Requires a CNI that honors NetworkPolicies (Calico, Cilium, OpenShift
OVN-Kubernetes). The default `kindnet` CNI on kind clusters does NOT
enforce NPs — these manifests will apply but be no-ops.
*/}}
{{- if .Values.networkPolicy.enabled }}
{{- $tenant := required ".Values.tenant must be set by the parent" .Values.tenant }}
{{- $labels := include "vault.labels" . }}
{{- $namespaces := dict }}
{{- /* Collect every unique workload ns we render into. */ -}}
{{- range $sa := (ternary .Values.serviceAccounts (list) (kindIs "slice" .Values.serviceAccounts)) }}
{{- $ns := dig "metadata" "namespace" "" $sa }}
{{- if $ns }}{{ $_ := set $namespaces $ns true }}{{ end }}
{{- end }}
{{- range $ns, $_ := $namespaces }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mto-extension-vault-enterprise-default-deny
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    # DNS — every workload needs it.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # Same-namespace egress — workloads still talk to each other.
    - to:
        - podSelector: {}
    # Cluster apiserver — required for the workload SA's TokenReview
    # round-trip. CIDR-free path: rely on the kubernetes Service in
    # default ns.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
          podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mto-extension-vault-enterprise-vault-egress
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - {{- toYaml $.Values.networkPolicy.vaultSelector | nindent 10 }}
{{- end }}
{{- end }}
{{- end }}
