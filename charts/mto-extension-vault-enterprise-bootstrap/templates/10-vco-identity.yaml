# The ServiceAccount every rendered VCO CR names in
# spec.authentication.serviceAccount. VCO mints a short-lived token for it on
# each login and logs in to Vault's kubernetes auth at vco.authPath, in
# vco.namespace, with vco.role.
#
# No credential is stored: the Vault role binds this ServiceAccount by name and
# namespace, and the token is minted per login. The Vault side is a one-time
# Vault-admin step — charts/README.md → "Vault bootstrap".
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.vco.serviceAccount }}
  namespace: {{ .Values.configNamespace }}
