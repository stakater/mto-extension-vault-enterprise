apiVersion: v2
name: mto-extension-vault-enterprise-bootstrap
description: |
  Cluster-level bootstrap for the Vault Enterprise / MTO integration.
  Installs the t-op-v2 parent Template (one child TemplateInstance per MTO
  Tenant CR), the child Templates that pull the mto-extension-vault-enterprise chart, the
  ServiceAccount every VCO CR logs in to Vault with, and the t-op-v2 RBAC
  needed to manage TemplateInstances, VCO CRs, and the workload-side objects.

  Requires: multi-tenant-operator (Tenant CRD), template-operator-v2 >= 0.0.5
  (child TemplateInstances need namespaceSelector), vault-config-operator with
  spec.authentication.targetNamespace, and Vault Enterprise (namespaces).
type: application
version: 0.1.0
appVersion: "0.1.0"
