name: E2E

# Not on every push. The suite builds a whole kind cluster — cert-manager,
# template-operator-v2, External Secrets, Reloader, Vault Enterprise,
# vault-config-operator (the Makefile's VCO_VERSION release), Keycloak, and Dex
# with the Dex Config Operator — which takes far longer than `make all`. So it
# runs when a human asks for it: on approval, by adding the label, or by
# dispatch.
#
# Inputs beyond the code:
#   - secrets.VAULT_LICENSE   the Vault Enterprise licence text. The suite
#                             refuses Community Edition, which ignores namespaces.
#   - secrets.GHCR_TOKEN (the username is stakater-user)
#                             read access to ghcr.io/stakater/browser-runner, the
#                             private image the suite's ui step runs its flows in.
on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [labeled]
  workflow_dispatch:

jobs:
  verify-label:
    name: Verify Label
    # An approval-triggered run executes PR-authored code with the licence in
    # the environment, so the approver must be an OWNER/MEMBER/COLLABORATOR.
    # Applying the label needs triage; a dispatch needs write.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.review.state == 'approved' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) || github.event.label.name == 'ok-to-test/kubernetes' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      # Removed so the next run needs a fresh request. Pinned by SHA: this job
      # holds pull-requests: write.
      - name: Remove the test label
        if: ${{ github.event.label.name == 'ok-to-test/kubernetes' }}
        continue-on-error: true
        uses: actions-ecosystem/action-remove-labels@2ce5d41b4b6aa8503e285553f75ed56e0a40bae0 # v1
        with:
          labels: ok-to-test/kubernetes

  e2e:
    name: Kind E2E
    needs: verify-label
    runs-on: ubuntu-latest
    # Above the lab build plus the suite's own go test timeout (E2E_GO_TIMEOUT
    # in the Makefile, 45m): a hung suite must fail in go test, so that
    # e2e-diagnostics still runs and the artifact upload has something to send.
    timeout-minutes: 90
    # Job-level, not workflow-level: every label added to a PR starts this
    # workflow, and a workflow-level group cancelled the running suite even when
    # the new run's verify-label skipped. A skipped job never joins the group.
    concurrency:
      group: e2e-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    # The pinned helm and yq, not the runner image's: the Makefile downloads its
    # pinned versions only when HELM / YQ_BIN point at a path that does not exist
    # yet. The render harness is sensitive to the yq version.
    env:
      HELM: ${{ github.workspace }}/bin/helm
      YQ_BIN: ${{ github.workspace }}/bin/yq

    permissions:
      contents: read
    steps:
      # For pull_request_review the default ref is the DEFAULT BRANCH: an
      # approval-triggered run would test main and gate nothing.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || '' }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Written to a file outside the workspace, never echoed. The Makefile
      # reads it into a Secret in the Vault namespace.
      - name: Write the Vault licence
        env:
          VAULT_LICENSE: ${{ secrets.VAULT_LICENSE }}
        run: |
          if [ -z "$VAULT_LICENSE" ]; then echo "secrets.VAULT_LICENSE is not set" >&2; exit 1; fi
          printf '%s' "$VAULT_LICENSE" > "$RUNNER_TEMP/vault.hclic"

      # make lab-runner-image pulls RUNNER_IMAGE and loads it into kind.
      - name: Log in to ghcr.io for the browser-runner image
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: stakater-user
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build the lab and run the suite
        run: make e2e-kind VAULT_LICENSE_FILE="$RUNNER_TEMP/vault.hclic"

      # The ui step's screenshots, to review; make screenshots puts them in the
      # docs. On a failure they are in the diagnostics below.
      - name: Upload screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}
          path: ./e2e-logs/screenshots/
          retention-days: 14
          if-no-files-found: error

      # e2e-kind writes these on any failure in the chain.
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ github.run_id }}
          path: ./e2e-logs/
          retention-days: 7
          if-no-files-found: warn
