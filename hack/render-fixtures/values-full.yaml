# Render-test fixture: every feature toggle on, every per-SA / per-Deployment
# annotation path exercised, all of it valid — misconfiguration cases live in
# values-guards.yaml. Tenant team-a owns namespaces team-a-dev and
# team-a-tools; team-b is a known peer for every share flavour.
#
# Every opt-in field is turned on somewhere here: a field behind an opt-in that
# no fixture enables is a field crd-validate never sends through the apiserver.
tenant: team-a
knownTenants: "team-a,team-b"

eso: enabled

vaultCABundle: |
  -----BEGIN CERTIFICATE-----
  MIIBFIXTUREONLYNOTAREALCERTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
  -----END CERTIFICATE-----

# Renders spec.authentication.namespace and nested tenant paths. role and
# serviceAccount differ, so a swap of the two fields is visible.
vco:
  namespace: org
  role: vco-role
  serviceAccount: vco-sa

kubernetesAuth:
  # Renders spec.tokenReviewerServiceAccount.
  tokenReviewerServiceAccount: vault-token-reviewer

sso:
  enabled: true
  oidc:
    issuerUrl: "https://dex.example.com"
    # Renders spec.OIDCDiscoveryCAPEM.
    caBundlePem: |
      -----BEGIN CERTIFICATE-----
      MIIBkTCB+wIJAJ3xVFyz0kQxMA0GCSqGSIb3DQEBCwUAMBExDzANBgNVBAMMBmRl
      -----END CERTIFICATE-----
  tenantRoleMapping:
    admin:      {}
    editor:     {}
    viewer:     {}
    audit-read: {}
    # Renders the fallback role.
    fallback: viewer

# Renders tokenPeriod.
token:
  ttl: 3600
  maxTTL: 14400
  period: 1800


monitoring:
  enabled: true

serviceAccounts:
  # Kitchen-sink SA: own-tenant grants + every share flavour.
  - metadata:
      name: app-a
      namespace: team-a-dev
      annotations:
        vault.stakater.com/kv: "true"
        vault.stakater.com/tier: editor
        vault.stakater.com/app: payments
        vault.stakater.com/kv-subscribe-ns: team-a-tools
        vault.stakater.com/kv-export-tenant: team-b
        vault.stakater.com/kv-import-tenant: team-b
  # Second tier + second namespace (makes team-a-tools an owned namespace so
  # app-a's kv-subscribe-ns target is valid).
  - metadata:
      name: app-b
      namespace: team-a-tools
      annotations:
        vault.stakater.com/kv: "true"
        vault.stakater.com/tier: admin
  # Read-only tier. No app annotation, so its app is its own name.
  - metadata:
      name: app-c
      namespace: team-a-dev
      annotations:
        vault.stakater.com/kv: "true"
        vault.stakater.com/tier: viewer
  # audit-read tier with a subscription: the metadata-list-only branch.
  - metadata:
      name: app-d
      namespace: team-a-tools
      annotations:
        vault.stakater.com/kv: "true"
        vault.stakater.com/tier: audit-read
        vault.stakater.com/kv-subscribe-ns: team-a-dev
  # No vault annotation at all → nothing rendered, no error.
  - metadata:
      name: plain-sa
      namespace: team-a-dev

deployments:
  # Exercises kv-secret.<name> (with and without #key), kv-subscribe.<name>,
  # and kv-import.<name> ExternalSecret flavours.
  - metadata:
      name: web
      namespace: team-a-dev
      annotations:
        vault.stakater.com/kv-secret.web-db: "db-creds#password"
        vault.stakater.com/kv-secret.web-cfg: "app-config"
        vault.stakater.com/kv-subscribe.tools-shared: "team-a-tools/shared-item"
        vault.stakater.com/kv-import.partner-data: "team-b/exported-item"
    spec:
      template:
        spec:
          serviceAccountName: app-a
  # No annotations → no ExternalSecrets for this deployment.
  - metadata:
      name: worker
      namespace: team-a-tools
    spec:
      template:
        spec:
          serviceAccountName: app-b
