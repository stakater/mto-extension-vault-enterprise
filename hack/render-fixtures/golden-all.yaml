# Source: mto-extension-vault-enterprise/templates/09-monitoring.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/instance: mto-extension-vault-enterprise
    app.kubernetes.io/managed-by: helm-via-template-operator-v2
    app.kubernetes.io/name: mto-extension-vault-enterprise
    app.kubernetes.io/version: 0.1.0
    helm.sh/chart: mto-extension-vault-enterprise-0.1.0
    stakater.com/tenant: team-a
  name: mto-extension-vault-enterprise-team-a
  namespace: monitoring
spec:
  groups:
    - name: mto-extension-vault-enterprise-team-a.reconcile
      rules:
        - alert: VaultConfigCRNeverReconciled
          annotations:
            description: vault-config-operator has not written this object to Vault. Check the CR's ReconcileFailed message and the operator logs.
            summary: Vault config CR {{ $labels.kind }}/{{ $labels.name }} never reconciled for tenant team-a
          expr: |
            sum by (kind, name, namespace) (
              kube_customresource_status_conditions{
                customresource_group="redhatcop.redhat.io",
                condition="ReconcileSuccessful",
                status!="true",
                label_stakater_com_tenant="team-a"
              }
            ) > 0
          for: 10m
          labels:
            severity: warning
            tenant: team-a
        - alert: VaultExternalSecretSyncFailed
          annotations:
            description: Vault login failure or missing source path. Check the ExternalSecret events and the Vault audit log.
            summary: ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} not syncing
          expr: |
            externalsecret_status_condition{
              status="False",
              type="Ready",
              label_stakater_com_tenant="team-a"
            } > 0
          for: 5m
          labels:
            severity: warning
            tenant: team-a
