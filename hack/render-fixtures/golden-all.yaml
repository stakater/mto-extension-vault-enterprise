apiVersion: redhatcop.redhat.io/v1alpha1
kind: Policy
metadata:
  labels:
    app.kubernetes.io/instance: mto-extension-vault-enterprise
    app.kubernetes.io/managed-by: helm-via-template-operator-v2
    app.kubernetes.io/name: mto-extension-vault-enterprise
    app.kubernetes.io/version: 0.1.0
    helm.sh/chart: mto-extension-vault-enterprise-0.1.0
    stakater.com/tenant: team-a
  name: team-a-team-a-tools-app-d
  namespace: vault-config
spec:
  authentication:
    namespace: org
    path: kubernetes
    role: vco-admin
    serviceAccount:
      name: vco-admin
    targetNamespace: team-a
  name: team-a-team-a-tools-app-d
  policy: |
    # 1. The app's own secrets, at kv/data/<env>/<ns>/<app>/. The app defaults to
    # the ServiceAccount name — the identity Vault authenticated — and is unique
    # within the namespace either by Kubernetes' own guarantee or by the render
    # check behind `vault.stakater.com/app`. Scoping here rather than at the
    # namespace stops one workload reading another's secrets just by sharing a
    # namespace with it.
    path "kv/data/dev/team-a-tools/app-d/*"     { capabilities = ["list"] }
    path "kv/metadata/dev/team-a-tools/app-d/*" { capabilities = ["list"] }
    # 2a. _shared/ READ — own Kubernetes namespace sub-prefix (all data-reading
    # tiers). This is how two apps in one namespace share deliberately.
    path "kv/metadata/dev/_shared/from-team-a-tools/*" { capabilities = ["list"] }
    path "kv/metadata/dev/_shared/from-team-a-dev/*" { capabilities = ["list"] }
    # 2b. _shared/ WRITE scoped to own Kubernetes namespace sub-prefix.
