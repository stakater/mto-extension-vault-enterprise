# Source: mto-extension-vault-enterprise/templates/08-networkpolicies.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/instance: mto-extension-vault-enterprise
    app.kubernetes.io/managed-by: helm-via-template-operator-v2
    app.kubernetes.io/name: mto-extension-vault-enterprise
    app.kubernetes.io/version: 0.1.0
    helm.sh/chart: mto-extension-vault-enterprise-0.1.0
    stakater.com/tenant: team-a
  name: mto-extension-vault-enterprise-default-deny
  namespace: team-a-dev
spec:
  egress:
    # DNS — every workload needs it.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
    # Same-namespace egress — workloads still talk to each other.
    - to:
        - podSelector: {}
    # Cluster apiserver — required for the workload SA's TokenReview
    # round-trip. CIDR-free path: rely on the kubernetes Service in
    # default ns.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
          podSelector: {}
  ingress:
    - from:
        - podSelector: {}
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
