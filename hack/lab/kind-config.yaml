# Kind cluster for the local lab, handed to `kind create cluster --config`.
#
# One node is enough: nothing here schedules by topology.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    # Pinned, and not to kind's default. template-operator-v2's CRDs carry a
    # CEL rule on objectFieldRef that Kubernetes 1.31 cannot compile
    # ("undefined field 'namespace'"), so they fail to install there. 1.33
    # matches OpenShift 4.20, the deployment target.
    image: kindest/node:v1.33.4
